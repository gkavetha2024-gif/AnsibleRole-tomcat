
---
- name: Add EPEL repository
  dnf:
    name: epel-release
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution_major_version'] == "10.2"

- name: Install basic packages
  package:
    name:
      - wget
      - unzip
      - curl
      - git
    state: present


- name: Install Java 21
  dnf:
    name: java-21-openjdk
    state: present

- name: Find Java installation path
  shell: readlink -f "$(command -v java)"
  register: java_path
  changed_when: false

- name: Set JAVA_HOME variable
  set_fact:
    JAVA_HOME: "{{ java_path.stdout | regex_replace('/bin/java$', '') }}"
    
- name: Check JAVA_HOME variable
  debug:
    var: JAVA_HOME

    #- name: Install Java 8
  #dnf:
    #name: java-1.8.0-openjdk
   # state: present
   
- name: Check JAVA_HOME variable
  debug:
    var: JAVA_HOME

- name: Add tomcat group
  group:
    name: tomcat
    state: present

- name: Add tomcat user
  user:
    name: tomcat
    group: tomcat
    home: /usr/share/tomcat
    create_home: false
    system: true
    shell: /sbin/nologin

- name: Download Tomcat
  get_url:
    url: "https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.12/bin/apache-tomcat-9.0.12.tar.gz"
    dest: "/tmp/apache-tomcat-9.0.12.tar.gz"
    mode: '0644'
    timeout: 60
    force: yes

- name: Create Tomcat directory
  file:
    path: /usr/share/tomcat
    state: directory
    owner: tomcat
    group: tomcat
    mode: '0755'

- name: Extract Tomcat archive
  unarchive:
    src: "{{ tomcat_archive_dest }}"
    dest: /usr/share/tomcat
    owner: tomcat
    group: tomcat
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: /usr/share/tomcat/bin

- name: Copy Tomcat service file
  template:
    src: tomcat.service.j2
    dest: /etc/systemd/system/tomcat.service
    owner: root
    group: root
    mode: '0644'

- name: Start and enable Tomcat
  systemd:
    name: tomcat
    state: started
    enabled: true
    daemon_reload: true

- name: Set UI access credentials
  template:
    src: tomcat-users.xml.j2
    dest: /usr/share/tomcat/conf/tomcat-users.xml
    owner: tomcat
    group: tomcat
    mode: '0640'
  notify: restart tomcat

- name: Allow access to Manager and Host Manager
  template:
    src: context.xml.j2
    dest: "{{ item }}"
    owner: tomcat
    group: tomcat
    mode: '0644'
  loop:
    - /usr/share/tomcat/webapps/host-manager/META-INF/context.xml
    - /usr/share/tomcat/webapps/manager/META-INF/context.xml
  notify: restart tomcat

- name: Copy WAR file to Tomcat
  copy:
    src: devops.war
    dest: /usr/share/tomcat/webapps/devops.war
    owner: tomcat
    group: tomcat
    mode: '0644'
  notify: restart tomcat